<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="The agent calls browser tools, the plugin speaks raw CDP to the sidebar webview, and the user watches the same tab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1424"/>
      <stop offset="1" stop-color="#161d36"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8cff"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .dim { fill: #8b95b5; }
      .text { fill: #e8ecfa; }
      .accent { fill: #8fa6ff; }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="url(#bg)"/>

  <!-- left column: agent and plugin -->
  <text x="48" y="58" class="sans dim" font-size="13" letter-spacing="1.5">MODEL SIDE</text>

  <rect x="48" y="78" width="300" height="76" rx="12" fill="#1c2545" stroke="#2c3866"/>
  <text x="68" y="110" class="sans text" font-size="17" font-weight="600">Agent in DSH</text>
  <text x="68" y="134" class="sans dim" font-size="13">any model, any workspace</text>

  <line x1="198" y1="154" x2="198" y2="190" stroke="#6f8cff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="48" y="194" width="300" height="104" rx="12" fill="#1c2545" stroke="#6f8cff" stroke-width="1.5"/>
  <text x="68" y="226" class="sans text" font-size="17" font-weight="600">dsh-sidebar-browser</text>
  <text x="68" y="250" class="mono accent" font-size="13">browser_snapshot  browser_click</text>
  <text x="68" y="270" class="mono accent" font-size="13">browser_type  browser_screenshot</text>
  <text x="68" y="288" class="sans dim" font-size="12">15 tools</text>

  <text x="48" y="336" class="mono dim" font-size="12">raw CDP over ws://127.0.0.1:9222</text>
  <text x="48" y="356" class="mono dim" font-size="12">target type: webview</text>
  <text x="48" y="376" class="sans dim" font-size="12">The app bundle stays unmodified.</text>

  <!-- connector -->
  <path d="M348 246 H452" stroke="#6f8cff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- right: app window -->
  <text x="460" y="58" class="sans dim" font-size="13" letter-spacing="1.5">DSH DESKTOP</text>
  <rect x="460" y="78" width="452" height="298" rx="12" fill="#121830" stroke="#2c3866"/>
  <circle cx="480" cy="96" r="5" fill="#ff6259"/>
  <circle cx="497" cy="96" r="5" fill="#ffbe2f"/>
  <circle cx="514" cy="96" r="5" fill="#2bc840"/>
  <line x1="460" y1="114" x2="912" y2="114" stroke="#2c3866"/>

  <!-- chat pane -->
  <text x="478" y="140" class="sans dim" font-size="12">Chat</text>
  <rect x="478" y="152" width="150" height="26" rx="8" fill="#1c2545"/>
  <text x="488" y="169" class="sans text" font-size="11">open the docs, find X</text>
  <rect x="478" y="188" width="166" height="20" rx="6" fill="#182040"/>
  <text x="488" y="202" class="mono accent" font-size="10">browser_navigate</text>
  <rect x="478" y="214" width="166" height="20" rx="6" fill="#182040"/>
  <text x="488" y="228" class="mono accent" font-size="10">browser_snapshot</text>
  <rect x="478" y="240" width="166" height="20" rx="6" fill="#182040"/>
  <text x="488" y="254" class="mono accent" font-size="10">browser_click 12</text>
  <line x1="662" y1="114" x2="662" y2="376" stroke="#2c3866"/>

  <!-- sidebar browser tab -->
  <rect x="674" y="126" width="226" height="238" rx="10" fill="#f5f7fc" stroke="#6f8cff" stroke-width="2"/>
  <rect x="674" y="126" width="226" height="30" rx="10" fill="#e3e8f6"/>
  <rect x="674" y="142" width="226" height="14" fill="#e3e8f6"/>
  <rect x="686" y="134" width="150" height="15" rx="7" fill="#ffffff"/>
  <text x="694" y="145" class="mono" font-size="9" fill="#5a6385">https://example.com</text>
  <rect x="690" y="172" width="120" height="12" rx="3" fill="#2b3350"/>
  <rect x="690" y="194" width="194" height="7" rx="3" fill="#c3cae0"/>
  <rect x="690" y="208" width="176" height="7" rx="3" fill="#c3cae0"/>
  <rect x="690" y="222" width="186" height="7" rx="3" fill="#c3cae0"/>
  <rect x="690" y="246" width="78" height="26" rx="6" fill="#4f6df5"/>
  <text x="704" y="263" class="sans" font-size="11" fill="#ffffff" font-weight="600">Sign in</text>
  <rect x="756" y="238" width="22" height="14" rx="4" fill="#ffbe2f"/>
  <text x="761" y="249" class="mono" font-size="9" fill="#1a1a1a" font-weight="700">12</text>
  <rect x="690" y="290" width="194" height="7" rx="3" fill="#c3cae0"/>
  <rect x="690" y="304" width="150" height="7" rx="3" fill="#c3cae0"/>
  <text x="690" y="348" class="sans" font-size="11" fill="#5a6385">You watch the same tab.</text>
</svg>
